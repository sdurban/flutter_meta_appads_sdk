group = "cat.durban.sergio.flutter_meta_appads_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Built-in Kotlin support: AGP 9+ compiles Kotlin sources natively, so the
// Kotlin Gradle Plugin (KGP) must not be applied there. On AGP < 9 hosts,
// keep applying KGP for backward compatibility.
// Applied via pluginManager (instead of `apply plugin:`) so the Flutter tool
// does not report this plugin as an unconditional KGP user on AGP 9+ builds.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    pluginManager.apply("org.jetbrains.kotlin.android")
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "cat.durban.sergio.flutter_meta_appads_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    // kotlinOptions only exists when KGP is applied (AGP < 9 branch above).
    // It is supported by every legacy KGP version, unlike the compilerOptions
    // DSL which requires KGP 2.0+.
    if (agpMajor < 9) {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation("com.facebook.android:facebook-android-sdk:18.2.3")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// On AGP 9+ the kotlin extension is provided by AGP's built-in Kotlin support,
// which only exposes the compilerOptions DSL (KGP 2.x API).
if (agpMajor >= 9) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}
